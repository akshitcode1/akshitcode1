<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120" width="1200" height="120" role="img" aria-labelledby="t">
  <title id="t">Let's build something together</title>
  <defs>
    <linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#D98A5F"/><stop offset="1" stop-color="#E8B04B"/></linearGradient>
    <clipPath id="c"><rect width="1200" height="120" rx="18"/></clipPath>
  </defs>
  <style>
    .sans { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; }
    .wave1 { animation: drift 9s linear infinite; } .wave2 { animation: drift 14s linear infinite reverse; }
    @keyframes drift { from { transform: translateX(0); } to { transform: translateX(-600px); } }
    .pulse { animation: pulse 1.6s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .25; } }
    @media (prefers-reduced-motion: reduce) { .wave1, .wave2, .pulse { animation: none; } }
  </style>
  <g clip-path="url(#c)">
    <rect width="1200" height="120" fill="#13110f"/>
    <g class="wave2" opacity=".35"><path d="M0 78 Q150 54 300 78 T600 78 T900 78 T1200 78 T1500 78 T1800 78 V120 H0Z" fill="#D98A5F"/></g>
    <g class="wave1" opacity=".5"><path d="M0 92 Q150 72 300 92 T600 92 T900 92 T1200 92 T1500 92 T1800 92 V120 H0Z" fill="#E8B04B"/></g>
  </g>
  <rect x="1" y="1" width="1198" height="118" rx="17" fill="none" stroke="#fff" stroke-opacity=".1"/>
  <circle cx="64" cy="40" r="5" fill="#6FBF86" class="pulse"/>
  <text x="82" y="45" class="mono" font-size="15" fill="#C9C0B3">task complete ✓  ·  thanks for stopping by</text>
  <text x="1136" y="46" text-anchor="end" class="sans" font-size="20" font-weight="600" fill="url(#g)">Let's build something together.</text>
</svg>
